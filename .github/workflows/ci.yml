# Reusable CI workflow
name: CI

on:
  workflow_call:

permissions: {}

jobs:
  ci:
    name: Build & Checks
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate generated plugin assets
        run: bun run plugins:check

      - name: Type check
        run: bun run typecheck

      - name: Format check
        run: bun run format:check

      - name: Lint
        run: bun run lint

      - name: Build
        run: bun run build

      - name: Build MCP package
        working-directory: packages/mcp
        run: bun run build

      - name: Validate public package artifacts
        run: bun run validate:packages:mcp-publish

      - name: Smoke built CLI and MCP
        timeout-minutes: 2
        env:
          GITHITS_DISABLE_UPDATE_CHECK: "1"
          GITHITS_AUTH_STORAGE: file
          GITHITS_API_TOKEN: ""
          GITHITS_TOKEN: ""
          XDG_CONFIG_HOME: ${{ runner.temp }}/githits-built-smoke
        run: |
          started=$SECONDS
          bun run smoke:cli:built
          bun run smoke:mcp:built
          elapsed=$((SECONDS - started))
          echo "Combined built smoke: ${elapsed}s"
          test "$elapsed" -le 120

      - name: Pack npm package
        run: |
          mkdir -p package-artifact
          npm pack --pack-destination package-artifact

      - name: Upload npm package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: package-artifact/*.tgz
          if-no-files-found: error

  test:
    name: Test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.4"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".node-version"

      - name: Setup Python for eval scorer tests
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Cache bun dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
          restore-keys: bun-${{ runner.os }}-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Test
        env:
          http_proxy: ""
          https_proxy: ""
          no_proxy: ""
        run: bun test

  compat:
    name: Compat / ${{ matrix.runtime }}
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: Node 20
            node-version: "20"
          - runtime: Node 22
            node-version: "22"
          - runtime: Node 24
            node-version: "24"
          - runtime: Node 26
            node-version: "26"
          - runtime: Bun
            bun-version: "1.4.4"

    steps:
      - name: Download npm package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: package-artifact

      - name: Setup Bun
        if: matrix.bun-version
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ matrix.bun-version }}

      - name: Setup Node.js
        if: matrix.node-version
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}

      - name: Verify package with Node
        if: matrix.node-version
        run: |
          mkdir node-compat
          cd node-compat
          npm init -y
          npm install ../package-artifact/*.tgz
          VERSION=$(./node_modules/.bin/githits --version)
          EXPECTED=$(node -p "require('./node_modules/githits/package.json').version")
          echo "node $(node --version): githits $VERSION"
          [ "$VERSION" = "$EXPECTED" ] || { echo "::error::Version mismatch: got '$VERSION', expected '$EXPECTED'"; exit 1; }
          ./node_modules/.bin/githits --help

      - name: Verify package with Bun
        if: matrix.bun-version
        run: |
          mkdir bun-compat
          cd bun-compat
          bun -e 'await Bun.write("package.json", JSON.stringify({ private: true }, null, 2))'
          bun add ../package-artifact/*.tgz
          VERSION=$(bun node_modules/githits/dist/cli.js --version)
          EXPECTED=$(bun -e "console.log(require('./node_modules/githits/package.json').version)")
          echo "bun $(bun --version): githits $VERSION"
          [ "$VERSION" = "$EXPECTED" ] || { echo "::error::Version mismatch: got '$VERSION', expected '$EXPECTED'"; exit 1; }
          bun node_modules/githits/dist/cli.js --help
